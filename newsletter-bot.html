<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노써치 뉴스레터 초안생성봇</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #1B2A4A;
  --teal:   #2E86AB;
  --green:  #27AE60;
  --orange: #F39C12;
  --red:    #E74C3C;
  --bg:     #F4F6F9;
  --white:  #FFFFFF;
  --border: #D5D8DC;
  --text:   #2C3E50;
  --muted:  #7F8C8D;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── 헤더 ── */
.header {
  background: var(--navy);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-logo { color: #fff; font-size: 18px; font-weight: 700; }
.header-badge {
  background: var(--teal);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
}

/* ── 레이아웃 ── */
.layout {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 0;
  height: calc(100vh - 54px);
}

/* ── 왼쪽 패널 (입력) ── */
.panel-left {
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 16px 20px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.form-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── 폼 요소 ── */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}
.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--white);
  transition: border-color 0.15s;
  resize: vertical;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(46,134,171,0.12);
}
.field .hint {
  font-size: 11px;
  color: var(--muted);
}

/* ── 랭킹 입력 카드 ── */
.ranking-list { display: flex; flex-direction: column; gap: 8px; }
.ranking-row {
  display: grid;
  grid-template-columns: 1fr 1fr 80px 70px 28px;
  gap: 6px;
  align-items: center;
}
.ranking-row input {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 9px;
  font-size: 12px;
  font-family: inherit;
}
.ranking-row input:focus {
  outline: none;
  border-color: var(--teal);
}
.ranking-row .del-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 0;
  line-height: 1;
}
.ranking-row .del-btn:hover { color: var(--red); }
.add-btn {
  background: none;
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 8px;
  font-size: 12px;
  color: var(--teal);
  cursor: pointer;
  width: 100%;
  text-align: center;
}
.add-btn:hover { background: #EBF5FB; border-color: var(--teal); }
.ranking-col-labels {
  display: grid;
  grid-template-columns: 1fr 1fr 80px 70px 28px;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 2px;
}

/* ── 생성 버튼 ── */
.panel-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}
.btn-generate {
  width: 100%;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.15s, transform 0.1s;
}
.btn-generate:hover { background: var(--teal); }
.btn-generate:active { transform: scale(0.98); }
.btn-generate:disabled { background: #95A5A6; cursor: not-allowed; }

/* ── 오른쪽 패널 (미리보기) ── */
.panel-right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-right-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.subject-edit {
  flex: 1;
  min-width: 200px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
}
.subject-edit:focus {
  outline: none;
  border-color: var(--teal);
}
.action-btns {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.btn-sm {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.15s;
}
.btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-copy { background: #ECF0F1; color: var(--text); }
.btn-copy:hover:not(:disabled) { background: #D5D8DC; }
.btn-stibee { background: var(--teal); color: #fff; }
.btn-stibee:hover:not(:disabled) { background: #1f6a8a; }

/* ── 미리보기 탭 ── */
.preview-tabs {
  display: flex;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  gap: 0;
}
.tab-btn {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
}

/* ── 미리보기 영역 ── */
.preview-area {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.preview-pane {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  display: none;
}
.preview-pane.active { display: block; }

/* HTML 미리보기 iframe */
#iframe-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  padding: 20px;
  background: #E8EDF2;
}
#preview-iframe {
  width: 600px;
  max-width: 100%;
  height: 100%;
  border: none;
  background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

/* 텍스트 에디터 */
#text-editor {
  width: 100%;
  height: 100%;
  border: none;
  padding: 20px 24px;
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 12px;
  line-height: 1.7;
  resize: none;
  color: var(--text);
  background: var(--white);
}
#text-editor:focus { outline: none; }

/* HTML 소스 */
#html-source {
  width: 100%;
  height: 100%;
  border: none;
  padding: 20px 24px;
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 11px;
  line-height: 1.6;
  resize: none;
  color: #2c3e50;
  background: #FAFAFA;
}

/* ── 스트리밍 상태 ── */
.streaming-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  display: none;
}
.streaming-overlay.active { display: flex; }
.stream-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.stream-text {
  font-size: 13px;
  color: var(--muted);
  max-width: 300px;
  text-align: center;
  font-family: monospace;
  word-break: break-all;
}

/* ── 토스트 ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--navy);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }

/* ── 빈 상태 ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--muted);
}
.empty-icon { font-size: 48px; opacity: 0.4; }
.empty-text { font-size: 14px; }

/* ── 반응형 ── */
@media (max-width: 860px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    height: auto;
  }
  .panel-left { max-height: 60vh; }
  #iframe-wrap { padding: 12px; }
  #preview-iframe { width: 100%; }
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-logo">📧 노써치</div>
  <div class="header-badge">뉴스레터 초안생성봇</div>
</div>

<!-- 레이아웃 -->
<div class="layout">

  <!-- ── 왼쪽: 입력 패널 ── -->
  <div class="panel-left">
    <div class="panel-title">✏️ 뉴스레터 정보 입력</div>

    <div class="form-body">

      <!-- 주차 -->
      <div class="field">
        <label>주차 레이블</label>
        <input type="text" id="weekLabel" placeholder="예: 2026년 6월 2주차">
      </div>

      <!-- 계절 테마 -->
      <div class="field">
        <label>계절 / 테마</label>
        <select id="season">
          <option value="">선택 안 함</option>
          <option value="에어컨/냉방">🌡️ 에어컨/냉방 (6~8월)</option>
          <option value="선풍기/서큘레이터">💨 선풍기/서큘레이터</option>
          <option value="제습기">💧 제습기</option>
          <option value="공기청정기">🌿 공기청정기</option>
          <option value="세탁기/건조기">🫧 세탁기/건조기</option>
          <option value="노트북/태블릿">💻 노트북/태블릿 (학생 시즌)</option>
          <option value="가습기/히터">🔥 가습기/히터 (겨울)</option>
          <option value="custom">직접 입력</option>
        </select>
        <input type="text" id="seasonCustom" placeholder="직접 입력" style="display:none; margin-top:6px;">
      </div>

      <!-- 랭킹 입력 -->
      <div class="field">
        <label>이번 주 TOP 랭킹</label>
        <div class="ranking-col-labels">
          <span>카테고리</span><span>랭킹명</span><span>클릭 수</span><span>성장률 %</span><span></span>
        </div>
        <div class="ranking-list" id="rankingList"></div>
        <button class="add-btn" id="addRankingBtn">+ 랭킹 추가</button>
        <div class="hint">최소 1개 이상 입력하면 더 좋은 초안이 생성됩니다.</div>
      </div>

      <!-- 에디터 메모 -->
      <div class="field">
        <label>에디터 메모 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
        <textarea id="memo" rows="3" placeholder="예: 이번 주 쿠팡 특가 에어컨 언급, 6월 초 무더위 시작 멘트 포함"></textarea>
      </div>

    </div><!-- /form-body -->

    <div class="panel-footer">
      <button class="btn-generate" id="generateBtn">
        <span id="generateIcon">🤖</span>
        <span id="generateLabel">초안 생성하기</span>
      </button>
    </div>
  </div><!-- /panel-left -->

  <!-- ── 오른쪽: 미리보기 패널 ── -->
  <div class="panel-right">

    <!-- 제목 + 액션 버튼 -->
    <div class="panel-right-header">
      <input
        type="text"
        class="subject-edit"
        id="subjectInput"
        placeholder="제목이 여기에 생성됩니다"
        disabled
      >
      <div class="action-btns">
        <button class="btn-sm btn-copy" id="copyBtn" disabled>📋 복사</button>
        <button class="btn-sm btn-stibee" id="stibeeBtn" disabled>📤 Stibee 전송</button>
      </div>
    </div>

    <!-- 탭 -->
    <div class="preview-tabs">
      <button class="tab-btn active" data-tab="preview">📧 미리보기</button>
      <button class="tab-btn" data-tab="text">📝 텍스트 편집</button>
      <button class="tab-btn" data-tab="source">🔧 HTML 소스</button>
    </div>

    <!-- 미리보기 영역 -->
    <div class="preview-area">

      <!-- 미리보기 탭 -->
      <div class="preview-pane active" id="pane-preview">
        <div id="iframe-wrap">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">✉️</div>
            <div class="empty-text">왼쪽 입력 후 <strong>초안 생성하기</strong>를 클릭하세요</div>
          </div>
          <iframe id="preview-iframe" style="display:none;"></iframe>
        </div>
      </div>

      <!-- 텍스트 편집 탭 -->
      <div class="preview-pane" id="pane-text">
        <textarea id="text-editor" placeholder="초안이 생성되면 여기에서 직접 편집할 수 있습니다."></textarea>
      </div>

      <!-- HTML 소스 탭 -->
      <div class="preview-pane" id="pane-source">
        <textarea id="html-source" placeholder="생성된 HTML 소스가 여기에 표시됩니다." readonly></textarea>
      </div>

      <!-- 스트리밍 오버레이 -->
      <div class="streaming-overlay" id="streamingOverlay">
        <div class="stream-spinner"></div>
        <div class="stream-text" id="streamText">Claude가 초안을 생성하고 있습니다...</div>
      </div>

    </div><!-- /preview-area -->

  </div><!-- /panel-right -->

</div><!-- /layout -->

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// ── 유틸리티 ──────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function toast(msg, type = "") {
  const el = $("toast");
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 3200);
}

function currentWeekLabel() {
  const d = new Date();
  const week = Math.floor((d.getDate() - 1) / 7) + 1;
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${week}주차`;
}

// ── 주차 레이블 자동 입력 ─────────────────────────────────────────────────
$("weekLabel").placeholder = currentWeekLabel();

// ── 계절 커스텀 입력 ─────────────────────────────────────────────────────
$("season").addEventListener("change", function () {
  $("seasonCustom").style.display = this.value === "custom" ? "block" : "none";
});

// ── 랭킹 행 관리 ─────────────────────────────────────────────────────────
let rankingCount = 0;

function addRankingRow(cat = "", name = "", clicks = "", growth = "") {
  const list = $("rankingList");
  const id = ++rankingCount;
  const row = document.createElement("div");
  row.className = "ranking-row";
  row.id = `rank-${id}`;
  row.innerHTML = `
    <input type="text" placeholder="카테고리" value="${cat}" class="r-cat">
    <input type="text" placeholder="랭킹명" value="${name}" class="r-name">
    <input type="number" placeholder="클릭" value="${clicks}" class="r-clicks" min="0">
    <input type="number" placeholder="성장%" value="${growth}" class="r-growth" step="0.1">
    <button class="del-btn" onclick="removeRow('rank-${id}')">×</button>
  `;
  list.appendChild(row);
}

function removeRow(id) {
  const el = document.getElementById(id);
  if (el && $("rankingList").children.length > 1) el.remove();
}

function getRankings() {
  return Array.from($("rankingList").querySelectorAll(".ranking-row"))
    .map(row => ({
      category:  row.querySelector(".r-cat").value.trim(),
      name:      row.querySelector(".r-name").value.trim(),
      clicks:    parseInt(row.querySelector(".r-clicks").value) || 0,
      growthPct: parseFloat(row.querySelector(".r-growth").value) || 0,
    }))
    .filter(r => r.category || r.name);
}

$("addRankingBtn").addEventListener("click", () => addRankingRow());

// 초기 행 3개
addRankingRow("에어컨", "벽걸이-에어컨-순위", 8234, 185.1);
addRankingRow("에어컨", "2in1-에어컨-순위", 6102, 159.9);
addRankingRow("제습기", "원룸-제습기-순위", 4521, 42.3);

// ── 탭 전환 ──────────────────────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".preview-pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $(`pane-${tab}`).classList.add("active");
  });
});

// ── HTML 이메일 템플릿 빌더 ────────────────────────────────────────────────
function buildEmailHtml(subject, sections, weekLabel, rankings) {
  const rankCards = rankings.slice(0, 5).map(r => `
    <div style="background:#F4F6F9;border-radius:8px;padding:14px 16px;
                margin-bottom:10px;border-left:4px solid ${r.growthPct >= 0 ? '#2E86AB' : '#E74C3C'}">
      <div style="font-weight:700;font-size:14px;color:#1B2A4A">${r.category} — ${r.name}</div>
      <div style="font-size:12px;color:#7F8C8D;margin-top:3px">클릭 ${r.clicks.toLocaleString()}</div>
      <span style="display:inline-block;background:${r.growthPct >= 0 ? '#D5F5E3' : '#FADBD8'};
                   color:${r.growthPct >= 0 ? '#27AE60' : '#E74C3C'};
                   font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin-top:4px">
        ${r.growthPct >= 0 ? '▲' : '▽'} ${Math.abs(r.growthPct).toFixed(1)}%
      </span>
    </div>`).join("");

  const sectionHtml = (title, body) => body ? `
    <div style="margin-bottom:24px">
      <div style="font-size:13px;font-weight:700;color:#2E86AB;text-transform:uppercase;
                  letter-spacing:0.8px;margin-bottom:10px;padding-bottom:6px;
                  border-bottom:2px solid #EBF5FB">${title}</div>
      <div style="color:#2C3E50;font-size:14px;line-height:1.8">
        ${body.replace(/\n/g, "<br>")}
      </div>
    </div>` : "";

  return `<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${subject}</title></head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div style="max-width:600px;margin:0 auto;background:#fff">

  <!-- 헤더 -->
  <div style="background:#1B2A4A;padding:24px 32px;text-align:center">
    <div style="color:#fff;font-size:20px;font-weight:700">📊 노써치 위클리</div>
    <div style="color:#AED6F1;font-size:12px;margin-top:4px">가전 랭킹 변화를 가장 빠르게</div>
  </div>

  <!-- 히어로 -->
  <div style="background:#2E86AB;padding:20px 32px">
    <div style="color:#AED6F1;font-size:12px;margin-bottom:4px">${weekLabel}</div>
    <div style="color:#fff;font-size:19px;font-weight:700;line-height:1.4">${subject}</div>
  </div>

  <!-- 본문 -->
  <div style="padding:28px 32px">
    <div style="color:#2C3E50;font-size:15px;line-height:1.8;margin-bottom:24px">
      ${(sections.opening || "").replace(/\n/g, "<br>")}
    </div>

    ${sectionHtml("⭐ 이번 주 하이라이트", sections.highlight)}

    ${rankings.length ? `
    <div style="margin-bottom:24px">
      <div style="font-size:13px;font-weight:700;color:#2E86AB;text-transform:uppercase;
                  letter-spacing:0.8px;margin-bottom:10px;padding-bottom:6px;
                  border-bottom:2px solid #EBF5FB">🚀 급상승 랭킹 TOP ${Math.min(rankings.length, 5)}</div>
      ${sectionHtml("", sections.topGrowers).replace(/<div.*?<\/div>/, "").replace(/^[\s\S]*?<div.*?color:#2C3E50.*?>([\s\S]*)<\/div>[\s\S]*$/,"$1") || `<div style="color:#2C3E50;font-size:14px;line-height:1.8;margin-bottom:12px">${(sections.topGrowers||"").replace(/\n/g,"<br>")}</div>`}
      ${rankCards}
    </div>` : ""}

    ${sectionHtml("🗓 지금 이 계절에", sections.seasonalTip)}

    <div style="text-align:center;margin:28px 0">
      <a href="https://nosearch.com" style="display:inline-block;background:#2E86AB;color:#fff;
         font-size:14px;font-weight:700;padding:14px 36px;border-radius:8px;text-decoration:none">
        전체 랭킹 보러가기 →
      </a>
    </div>

    ${sections.closing ? `<div style="color:#7F8C8D;font-size:13px;line-height:1.8">${sections.closing.replace(/\n/g,"<br>")}</div>` : ""}
  </div>

  <!-- 푸터 -->
  <div style="background:#F4F6F9;padding:16px 32px;text-align:center;border-top:1px solid #ECF0F1">
    <p style="font-size:11px;color:#95A5A6;margin:4px 0">
      <a href="https://nosearch.com" style="color:#2E86AB;text-decoration:none">nosearch.com</a>
      &nbsp;|&nbsp;
      <a href="{{unsubscribeUrl}}" style="color:#2E86AB;text-decoration:none">구독 취소</a>
    </p>
  </div>
</div>
</body></html>`;
}

// ── 초안 생성 ─────────────────────────────────────────────────────────────
let generatedHtml = "";
let generatedSections = {};

$("generateBtn").addEventListener("click", generateDraft);

async function generateDraft() {
  const weekLabel = $("weekLabel").value.trim() || currentWeekLabel();
  const seasonVal = $("season").value;
  const season    = seasonVal === "custom" ? $("seasonCustom").value.trim() : seasonVal;
  const memo      = $("memo").value.trim();
  const rankings  = getRankings();

  // 로딩 상태
  setGenerating(true);
  $("streamText").textContent = "Claude가 초안을 생성하고 있습니다...";

  let accumulated = "";

  try {
    const res = await fetch("/api/newsletter-draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ weekLabel, season, memo, rankings, stream: true }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split("\n")) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (raw === "[DONE]") break;
        try {
          const evt = JSON.parse(raw);
          if (evt.delta) {
            accumulated += evt.delta;
            // 스트리밍 중 진행 상황 표시
            const preview = accumulated.length > 60
              ? "..." + accumulated.slice(-60)
              : accumulated;
            $("streamText").textContent = preview;
          }
        } catch {}
      }
    }

    // JSON 파싱
    let sections = {};
    let subject = "";
    try {
      let jsonStr = accumulated.trim();
      if (jsonStr.includes("```")) {
        jsonStr = jsonStr.split("```")[1];
        if (jsonStr.startsWith("json")) jsonStr = jsonStr.slice(4);
      }
      sections = JSON.parse(jsonStr);
      subject = sections.subject || "";
      delete sections.subject;
    } catch {
      sections = { opening: accumulated };
      subject = `${weekLabel} 가전 랭킹 동향`;
    }

    generatedSections = sections;

    // 제목
    const fullSubject = `[노써치 위클리] ${subject}`;
    $("subjectInput").value = fullSubject;
    $("subjectInput").disabled = false;

    // HTML 빌드
    generatedHtml = buildEmailHtml(fullSubject, sections, weekLabel, rankings);

    // 텍스트 편집기
    const textContent = [
      `제목: ${fullSubject}`,
      "",
      "=== 인사말 ===",
      sections.opening || "",
      "",
      "=== 하이라이트 ===",
      sections.highlight || "",
      "",
      "=== 성장 랭킹 ===",
      sections.topGrowers || "",
      "",
      "=== 계절 추천 ===",
      sections.seasonalTip || "",
      "",
      "=== 마무리 ===",
      sections.closing || "",
    ].join("\n");
    $("text-editor").value = textContent;

    // HTML 소스
    $("html-source").value = generatedHtml;

    // 미리보기 iframe
    const iframe = $("preview-iframe");
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(generatedHtml);
    doc.close();
    $("emptyState").style.display = "none";
    iframe.style.display = "block";

    // 버튼 활성화
    $("copyBtn").disabled = false;
    $("stibeeBtn").disabled = false;

    toast("초안이 생성되었습니다 ✨", "success");

  } catch (err) {
    toast(`오류: ${err.message}`, "error");
    $("streamText").textContent = `오류: ${err.message}`;
  } finally {
    setGenerating(false);
  }
}

function setGenerating(on) {
  $("generateBtn").disabled = on;
  $("generateIcon").textContent = on ? "⏳" : "🤖";
  $("generateLabel").textContent = on ? "생성 중..." : "초안 생성하기";
  $("streamingOverlay").classList.toggle("active", on);
}

// ── 복사 ────────────────────────────────────────────────────────────────────
$("copyBtn").addEventListener("click", () => {
  const textContent = $("text-editor").value;
  navigator.clipboard.writeText(textContent).then(() => {
    toast("텍스트가 복사되었습니다.", "success");
  });
});

// ── 텍스트 편집 시 iframe 동기화 ────────────────────────────────────────────
// (간단 구현: 직접 편집은 text-editor에서, 미리보기는 마지막 생성본 유지)

// ── Stibee 전송 ──────────────────────────────────────────────────────────────
$("stibeeBtn").addEventListener("click", sendToStibee);

async function sendToStibee() {
  const subject = $("subjectInput").value.trim();
  if (!subject || !generatedHtml) {
    toast("먼저 초안을 생성하세요.", "error");
    return;
  }

  $("stibeeBtn").disabled = true;
  $("stibeeBtn").textContent = "전송 중...";

  try {
    const res = await fetch("/api/newsletter-stibee", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subject, html: generatedHtml }),
    });
    const data = await res.json();

    if (!data.ok) throw new Error(data.error || "Stibee 오류");

    toast(`Stibee 드래프트 등록 완료! (ID: ${data.emailId})`, "success");
    $("stibeeBtn").textContent = "✅ 전송 완료";
    setTimeout(() => {
      $("stibeeBtn").textContent = "📤 Stibee 전송";
      $("stibeeBtn").disabled = false;
    }, 3000);

  } catch (err) {
    toast(`전송 실패: ${err.message}`, "error");
    $("stibeeBtn").disabled = false;
    $("stibeeBtn").textContent = "📤 Stibee 전송";
  }
}

// ── 제목 수정 시 미리보기 동기화 ─────────────────────────────────────────────
$("subjectInput").addEventListener("input", function () {
  if (!generatedHtml) return;
  const weekLabel = $("weekLabel").value.trim() || currentWeekLabel();
  const rankings = getRankings();
  generatedHtml = buildEmailHtml(this.value, generatedSections, weekLabel, rankings);
  $("html-source").value = generatedHtml;
  const iframe = $("preview-iframe");
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open(); doc.write(generatedHtml); doc.close();
});
</script>
</body>
